name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Component Registry
        run: npm run validate:registry
      - name: Validate Site Composer
        run: npm run validate:composer
      - name: Validate Export Engine
        run: npm run validate:export
      - name: Validate Shopify Export
        run: npm run validate:shopify
      - name: Validate Reference Store
        run: npm run validate:reference-store
      - name: Validate Guided UX Defaults
        run: npm run validate:ux
      - name: Validate Shopify Reference Assets
        run: npm run validate:reference-assets
      - name: Validate Shopify Failed-Run Repair
        run: npm run validate:shopify-repair
      - name: Build
        run: npm run build
